
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Cleaning Service Management</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="login-container">
    <section class="login-card">

      <div class="login-content">
        <h1>Cleaning Service Management</h1>

        <h2>Hai! Selamat datang</h2>
        <p class="welcome-text">
          Silakan masuk untuk melanjutkan
        </p>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            >
          </div>

          <div class="input-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                aria-label="Tampilkan password"
              >
                👁
              </button>
            </div>
          </div>

          <div class="forgot-wrapper">
            <button type="button" id="forgotPassword">
              Lupa kata sandi?
            </button>
          </div>

          <button type="submit" id="loginButton">
            Login
          </button>

          <p id="loginMessage" role="status"></p>
        </form>
      </div>

      <div class="logo-area">
       <img
       src="ASSETS/logo-ardend.png"
       alt="PT. Ardend Adhikara Pandita"
>

        <p>PT. Ardend Adhikara Pandita</p>
      </div>

    </section>

    <footer>
      © 2026 PT. Ardend Adhikara Pandita
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
